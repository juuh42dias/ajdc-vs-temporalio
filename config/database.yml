# PostgreSQL for all environments.
# Development uses the Docker container from the README:
#   docker run -d --name ajdc-demo-postgres \
#     -e POSTGRES_USER=ajdc_demo -e POSTGRES_PASSWORD=ajdc_demo \
#     -e POSTGRES_DB=ajdc_vs_temporal_demo_development -p 5432:5432 postgres:17
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  username: <%= ENV.fetch("DB_USER", "ajdc_demo") %>
  password: <%= ENV.fetch("DB_PASSWORD", "ajdc_demo") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "ajdc_vs_temporal_demo_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "ajdc_vs_temporal_demo_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "ajdc_vs_temporal_demo_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_CACHE_NAME", "ajdc_vs_temporal_demo_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_QUEUE_NAME", "ajdc_vs_temporal_demo_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_CABLE_NAME", "ajdc_vs_temporal_demo_production_cable") %>
    migrations_paths: db/cable_migrate
